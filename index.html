<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>CosmoPilot</title>

<style>
* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030a;
    font-family: monospace;
}

body {
    touch-action: none;
}

button,
canvas {
    touch-action: none;
}

input {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
}

#gameWrapper {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030a;
}

#gameCanvas {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(100vw, 177.78vh);
    height: min(56.25vw, 100vh);
    transform: translate(-50%, -50%);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #02030a;
}

#creator {
    position: fixed;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffffff;
    font-size: 10px;
    letter-spacing: 2px;
    z-index: 20;
    text-shadow: 2px 2px #000;
    pointer-events: none;
}

/* HUD */

#hud {
    position: fixed;
    top: 26px;
    left: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 20;
    pointer-events: none;
}

.hudBox {
    color: white;
    font-size: 14px;
    text-shadow: 2px 2px #000;
}

#livesText {
    display: flex;
    gap: 5px;
    align-items: center;
}

.pixelHeart {
    position: relative;
    width: 12px;
    height: 11px;
    display: inline-block;
    background: #ff3030;
    clip-path: polygon(
        0 25%,
        25% 25%,
        25% 0,
        50% 0,
        50% 12%,
        75% 0,
        100% 0,
        100% 50%,
        75% 50%,
        75% 75%,
        50% 100%,
        25% 75%,
        0 50%
    );
    image-rendering: pixelated;
}

.pixelHeart.empty {
    background: #33333f;
}

#powerText {
    min-width: 90px;
    text-align: center;
}

#pauseButton {
    pointer-events: auto;
    border: 2px solid white;
    background: #111827;
    color: white;
    width: 42px;
    height: 34px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 4px;
}

#pauseButton:active {
    transform: scale(0.92);
}

/* CONTROLS */

#controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 15px;
    z-index: 20;
    pointer-events: none;
}

#leftControls {
    position: absolute;
    left: 18px;
    bottom: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: auto;
}

.controlButton {
    width: 54px;
    height: 45px;
    border: 2px solid white;
    border-radius: 5px;
    background: rgba(15, 23, 42, 0.88);
    color: white;
    font-size: 23px;
    font-family: monospace;
    font-weight: bold;
}

.controlButton:active {
    transform: scale(0.92);
    background: rgba(50, 70, 100, 0.95);
}

#fireButton {
    position: absolute;
    right: 18px;
    bottom: 0;
    width: 74px;
    height: 54px;
    border: 2px solid white;
    border-radius: 5px;
    background: rgba(60, 20, 20, 0.92);
    pointer-events: auto;
}

#fireButton::before {
    content: "";
    position: absolute;
    left: 19px;
    top: 21px;
    width: 30px;
    height: 9px;
    background: #f2f2f2;
    box-shadow:
        7px 0 0 #ffffff,
        14px 0 0 #ffdf4a,
        21px 0 0 #ff8c32;
}

#fireButton::after {
    content: "";
    position: absolute;
    left: 15px;
    top: 18px;
    width: 6px;
    height: 15px;
    background: #ffffff;
}

/* OVERLAYS */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.78);
}

.overlay.hidden {
    display: none;
}

.panel {
    width: min(88vw, 390px);
    padding: 25px;
    border: 3px solid white;
    background: #090d18;
    color: white;
    text-align: center;
    box-shadow: 0 0 0 4px #172033;
}

.panel h1 {
    margin: 0 0 12px;
    font-size: 28px;
}

.panel p {
    font-size: 13px;
    line-height: 1.5;
}

.mainButton {
    margin-top: 12px;
    width: 100%;
    min-height: 46px;
    border: 2px solid white;
    background: #182338;
    color: white;
    font-family: monospace;
    font-size: 15px;
    font-weight: bold;
    border-radius: 3px;
}

.mainButton:active {
    transform: scale(0.97);
}

/* CHEAT */

#cheatInput {
    width: 100%;
    height: 42px;
    margin-top: 14px;
    padding: 8px;
    border: 2px solid #777;
    background: #02030a;
    color: white;
    font-family: monospace;
    text-align: center;
    text-transform: uppercase;
}

#cheatMessage {
    min-height: 18px;
    margin-top: 8px;
    font-size: 11px;
}

/* PORTRAIT */

#portraitWarning {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: #02030a;
    color: white;
    text-align: center;
    padding: 30px;
}

#portraitWarning .portraitBox {
    border: 3px solid white;
    padding: 25px;
}

#portraitIcon {
    width: 36px;
    height: 55px;
    border: 4px solid white;
    margin: 0 auto 20px;
    position: relative;
}

#portraitIcon::after {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    background: white;
    left: 11px;
    bottom: 4px;
}

@media (orientation: portrait) {
    #portraitWarning {
        display: flex;
    }
}

/* POWERUP PIXEL ICONS */

.powerIcon {
    display: inline-block;
    vertical-align: middle;
    margin-right: 5px;
}

.pixelShield {
    width: 15px;
    height: 18px;
    background: #44aaff;
    clip-path: polygon(
        50% 0,
        100% 18%,
        90% 68%,
        50% 100%,
        10% 68%,
        0 18%
    );
    box-shadow: inset 0 0 0 2px #d9f4ff;
}

.pixelSpeed {
    position: relative;
    width: 21px;
    height: 16px;
}

.pixelSpeed::before,
.pixelSpeed::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 6px;
    background: #ffe600;
    clip-path: polygon(
        0 0,
        55% 0,
        55% 35%,
        100% 35%,
        100% 65%,
        55% 65%,
        55% 100%,
        0 100%,
        45% 50%
    );
}

.pixelSpeed::before {
    left: 0;
    top: 0;
}

.pixelSpeed::after {
    left: 9px;
    top: 8px;
}
</style>
</head>

<body>

<div id="gameWrapper">

    <canvas id="gameCanvas" width="480" height="270"></canvas>

    <div id="creator">CREATED BY GETOGENOV</div>

    <div id="hud">
        <div class="hudBox" id="livesText"></div>

        <div class="hudBox" id="scoreText">
            SCORE: 0
        </div>

        <div class="hudBox" id="powerText"></div>

        <button id="pauseButton">II</button>
    </div>

    <div id="controls">

        <div id="leftControls">
            <button class="controlButton" id="upButton">▲</button>
            <button class="controlButton" id="downButton">▼</button>
        </div>

        <button id="fireButton"></button>

    </div>

</div>

<!-- START -->

<div class="overlay" id="startOverlay">
    <div class="panel">
        <h1>COSMOPILOT</h1>

        <p>
            Космический пилот.<br>
            Уничтожай астероиды,<br>
            собирай монеты и бонусы.
        </p>

        <button class="mainButton" id="startButton">
            START GAME
        </button>
    </div>
</div>

<!-- PAUSE -->

<div class="overlay hidden" id="pauseOverlay">
    <div class="panel">

        <h1>PAUSED</h1>

        <button class="mainButton" id="resumeButton">
            RESUME
        </button>

        <input
            id="cheatInput"
            type="text"
            maxlength="30"
            placeholder="ENTER CHEAT"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
        >

        <button class="mainButton" id="activateCheatButton">
            ACTIVATE CHEAT
        </button>

        <div id="cheatMessage"></div>

    </div>
</div>

<!-- GAME OVER -->

<div class="overlay hidden" id="gameOverOverlay">
    <div class="panel">

        <h1>GAME OVER</h1>

        <p id="finalScore">
            SCORE: 0
        </p>

        <button class="mainButton" id="restartButton">
            PLAY AGAIN
        </button>

    </div>
</div>

<!-- PORTRAIT -->

<div id="portraitWarning">
    <div class="portraitBox">
        <div id="portraitIcon"></div>

        <div>
            ПОВЕРНИ ТЕЛЕФОН<br>
            В ГОРИЗОНТАЛЬНОЕ ПОЛОЖЕНИЕ
        </div>
    </div>
</div>

<script>
"use strict";

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

ctx.imageSmoothingEnabled = false;

/* =========================
   UI
========================= */

const startOverlay = document.getElementById("startOverlay");
const pauseOverlay = document.getElementById("pauseOverlay");
const gameOverOverlay = document.getElementById("gameOverOverlay");

const startButton = document.getElementById("startButton");
const resumeButton = document.getElementById("resumeButton");
const restartButton = document.getElementById("restartButton");

const pauseButton = document.getElementById("pauseButton");

const upButton = document.getElementById("upButton");
const downButton = document.getElementById("downButton");
const fireButton = document.getElementById("fireButton");

const livesText = document.getElementById("livesText");
const scoreText = document.getElementById("scoreText");
const powerText = document.getElementById("powerText");

const cheatInput = document.getElementById("cheatInput");
const activateCheatButton = document.getElementById("activateCheatButton");
const cheatMessage = document.getElementById("cheatMessage");

const finalScore = document.getElementById("finalScore");

/* =========================
   GAME STATE
========================= */

let gameRunning = false;
let paused = false;

let score = 0;
let lives = 3;

let lastTime = 0;

let spawnTimer = 0;
let coinTimer = 0;
let powerupTimer = 0;

let fireTimer = 0;
let invulnerabilityTimer = 0;

let shieldTimer = 0;
let speedTimer = 0;

let speedAnimationTime = 0;

let autoAim = false;

/* =========================
   SHIP
========================= */

const ship = {
    x: 75,
    y: H / 2,
    width: 25,
    height: 18,
    speed: 145,
    fireDelay: 0.28
};

/* =========================
   INPUT
========================= */

const keys = {
    up: false,
    down: false,
    fire: false
};

/* =========================
   OBJECT ARRAYS
========================= */

let bullets = [];
let asteroids = [];
let coins = [];
let powerups = [];
let particles = [];
let stars = [];

/* =========================
   RANDOM
========================= */

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function randomInt(min, max) {
    return Math.floor(random(min, max + 1));
}

/* =========================
   STARS
========================= */

function createStars() {
    stars = [];

    for (let i = 0; i < 90; i++) {
        stars.push({
            x: random(0, W),
            y: random(0, H),
            size: randomInt(1, 2),
            speed: random(8, 28),
            brightness: random(0.3, 1)
        });
    }
}

/* =========================
   RESET
========================= */

function resetGame() {
    score = 0;
    lives = 3;

    bullets = [];
    asteroids = [];
    coins = [];
    powerups = [];
    particles = [];

    ship.x = 75;
    ship.y = H / 2;

    spawnTimer = 0;
    coinTimer = 0;
    powerupTimer = 0;

    fireTimer = 0;
    invulnerabilityTimer = 0;

    shieldTimer = 0;
    speedTimer = 0;

    speedAnimationTime = 0;

    autoAim = false;

    cheatInput.value = "";
    cheatMessage.textContent = "";

    createStars();

    updateHUD();
}

/* =========================
   HUD
========================= */

function updateHUD() {

    livesText.innerHTML = "";

    for (let i = 0; i < 3; i++) {
        const heart = document.createElement("span");

        heart.className = "pixelHeart";

        if (i >= lives) {
            heart.classList.add("empty");
        }

        livesText.appendChild(heart);
    }

    scoreText.textContent = "SCORE: " + score;

    let power = "";

    if (shieldTimer > 0) {
        power +=
            '<span class="powerIcon pixelShield"></span>' +
            " " + shieldTimer.toFixed(1);
    }

    if (speedTimer > 0) {

        if (power !== "") {
            power += "  ";
        }

        power +=
            '<span class="powerIcon pixelSpeed"></span>' +
            " " + speedTimer.toFixed(1);
    }

    powerText.innerHTML = power;
}

/* =========================
   SHIP DRAW
========================= */

function drawShip() {

    ctx.save();

    if (invulnerabilityTimer > 0) {
        if (Math.floor(invulnerabilityTimer * 12) % 2 === 0) {
            ctx.globalAlpha = 0.35;
        }
    }

    const x = Math.round(ship.x);
    const y = Math.round(ship.y);

    /* ship shadow */

    ctx.fillStyle = "#000";
    ctx.fillRect(x - 8, y - 7, 25, 16);

    /* main body */

    ctx.fillStyle = "#d8e4ff";

    ctx.fillRect(x - 4, y - 7, 13, 14);
    ctx.fillRect(x + 8, y - 4, 7, 8);
    ctx.fillRect(x + 15, y - 2, 6, 4);

    /* nose */

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(x + 20, y - 1, 5, 2);

    /* wings */

    ctx.fillStyle = "#6e7fa8";

    ctx.fillRect(x - 9, y - 8, 9, 5);
    ctx.fillRect(x - 9, y + 3, 9, 5);

    /* cockpit */

    ctx.fillStyle = "#32d9ff";

    ctx.fillRect(x + 2, y - 4, 6, 8);

    ctx.fillStyle = "#baf7ff";
    ctx.fillRect(x + 4, y - 3, 2, 2);

    /* engine */

    ctx.fillStyle = "#ff9d2e";

    ctx.fillRect(x - 13, y - 3, 5, 6);

    ctx.fillStyle = "#fff05a";

    ctx.fillRect(x - 18, y - 2, 5, 4);

    ctx.restore();

    drawShield();

    if (speedTimer > 0) {
        drawSpeedTrail();
    }
}

/* =========================
   SHIELD
========================= */

function drawShield() {

    if (shieldTimer <= 0) {
        return;
    }

    const pulse =
        Math.sin(performance.now() * 0.008) * 2;

    ctx.save();

    ctx.strokeStyle = "#4fdcff";
    ctx.lineWidth = 2;

    ctx.globalAlpha =
        0.55 + Math.sin(performance.now() * 0.01) * 0.15;

    ctx.beginPath();

    ctx.arc(
        ship.x + 3,
        ship.y,
        22 + pulse,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    ctx.strokeStyle = "#a9f5ff";
    ctx.globalAlpha *= 0.5;

    ctx.beginPath();

    ctx.arc(
        ship.x + 3,
        ship.y,
        25 + pulse,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    ctx.restore();
}

/* =========================
   SPEED TRAIL
========================= */

function drawSpeedTrail() {

    const baseX = ship.x - 16;
    const baseY = ship.y;

    ctx.save();

    for (let i = 0; i < 12; i++) {

        const offset =
            (speedAnimationTime * 130 + i * 23) % 115;

        const length =
            8 + (i % 4) * 5;

        const x =
            baseX - offset;

        const y =
            baseY + ((i % 5) - 2) * 4;

        const mix =
            (Math.sin(speedAnimationTime * 8 + i) + 1) / 2;

        const r = Math.round(255 * (1 - mix));
        const g = Math.round(220 + 35 * mix);
        const b = Math.round(30 + 30 * mix);

        ctx.fillStyle =
            "rgb(" + r + "," + g + "," + b + ")";

        ctx.globalAlpha =
            0.25 + (1 - offset / 115) * 0.55;

        ctx.fillRect(
            Math.round(x),
            Math.round(y),
            length,
            2
        );
    }

    ctx.restore();
}

/* =========================
   ASTEROIDS
========================= */

function spawnAsteroid() {

    const radius = random(10, 23);

    const points = randomInt(7, 10);

    const vertices = [];

    for (let i = 0; i < points; i++) {

        const angle =
            (Math.PI * 2 / points) * i;

        const r =
            radius * random(0.72, 1.18);

        vertices.push({
            x: Math.cos(angle) * r,
            y: Math.sin(angle) * r
        });
    }

    asteroids.push({
        x: W + radius,
        y: random(25, H - 25),
        radius,
        speed: random(55, 105),
        rotation: random(0, Math.PI * 2),
        rotationSpeed: random(-1.2, 1.2),
        vertices
    });
}

/* =========================
   DRAW ASTEROID
========================= */

function drawAsteroid(a) {

    ctx.save();

    ctx.translate(
        Math.round(a.x),
        Math.round(a.y)
    );

    ctx.rotate(a.rotation);

    ctx.fillStyle = "#6b7280";

    ctx.beginPath();

    a.vertices.forEach((v, i) => {

        if (i === 0) {
            ctx.moveTo(v.x, v.y);
        } else {
            ctx.lineTo(v.x, v.y);
        }

    });

    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#9ca3af";
    ctx.lineWidth = 1;
    ctx.stroke();

    /* craters */

    ctx.fillStyle = "#414754";

    ctx.fillRect(
        -a.radius * 0.45,
        -a.radius * 0.2,
        5,
        4
    );

    ctx.fillRect(
        a.radius * 0.15,
        -a.radius * 0.55,
        4,
        4
    );

    ctx.fillRect(
        a.radius * 0.15,
        a.radius * 0.2,
        6,
        5
    );

    ctx.fillRect(
        -a.radius * 0.55,
        a.radius * 0.35,
        4,
        3
    );

    ctx.restore();
}

/* =========================
   COINS
========================= */

function spawnCoin() {

    coins.push({
        x: W + 10,
        y: random(25, H - 25),
        speed: random(70, 105),
        rotation: random(0, Math.PI * 2),
        rotationSpeed: random(4, 8),
        radius: 6
    });
}

function drawCoin(c) {

    ctx.save();

    ctx.translate(
        Math.round(c.x),
        Math.round(c.y)
    );

    const width =
        Math.max(
            2,
            Math.abs(Math.cos(c.rotation)) * 6
        );

    ctx.fillStyle = "#ffe44d";

    ctx.fillRect(
        -width / 2,
        -6,
        width,
        12
    );

    ctx.fillStyle = "#fff6a3";

    ctx.fillRect(
        -width / 2,
        -4,
        Math.max(1, width / 2),
        2
    );

    ctx.restore();
}

/* =========================
   POWERUPS
========================= */

function spawnPowerup() {

    const type =
        Math.random() < 0.5
            ? "shield"
            : "speed";

    powerups.push({
        x: W + 15,
        y: random(30, H - 30),
        speed: 75,
        type,
        pulse: random(0, Math.PI * 2)
    });
}

function drawPowerup(p) {

    ctx.save();

    ctx.translate(
        Math.round(p.x),
        Math.round(p.y)
    );

    const pulse =
        Math.sin(performance.now() * 0.006 + p.pulse) * 1.5;

    if (p.type === "shield") {

        ctx.fillStyle = "#3dc9ff";

        ctx.beginPath();

        ctx.moveTo(0, -9 - pulse);
        ctx.lineTo(8, -5);
        ctx.lineTo(7, 4);
        ctx.lineTo(0, 10);
        ctx.lineTo(-7, 4);
        ctx.lineTo(-8, -5);

        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#bdf5ff";

        ctx.fillRect(-2, -5, 4, 8);

    } else {

        ctx.fillStyle = "#ffe600";

        /* first arrow */

        ctx.fillRect(-9, -5, 7, 3);
        ctx.fillRect(-5, -2, 7, 3);
        ctx.fillRect(-2, 1, 4, 3);

        /* second arrow */

        ctx.fillRect(1, -5, 7, 3);
        ctx.fillRect(5, -2, 7, 3);
        ctx.fillRect(8, 1, 4, 3);
    }

    ctx.restore();
}

/* =========================
   BULLETS
========================= */

function fireBullet() {

    if (fireTimer > 0) {
        return;
    }

    fireTimer = ship.fireDelay;

    let vx = 300;
    let vy = 0;

    if (autoAim) {

        const target = findNearestAsteroid();

        if (target) {

            const dx = target.x - ship.x;
            const dy = target.y - ship.y;

            const length =
                Math.sqrt(dx * dx + dy * dy) || 1;

            vx = (dx / length) * 320;
            vy = (dy / length) * 320;
        }
    }

    bullets.push({
        x: ship.x + 23,
        y: ship.y,
        vx,
        vy,
        life: 2
    });
}

function drawBullet(b) {

    ctx.fillStyle = "#fff5a0";

    ctx.fillRect(
        Math.round(b.x),
        Math.round(b.y),
        5,
        2
    );

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        Math.round(b.x - 2),
        Math.round(b.y),
        2,
        2
    );
}

/* =========================
   AUTO AIM
========================= */

function findNearestAsteroid() {

    let nearest = null;
    let nearestDistance = Infinity;

    for (const a of asteroids) {

        if (a.x < ship.x - 10) {
            continue;
        }

        const dx = a.x - ship.x;
        const dy = a.y - ship.y;

        const distance =
            dx * dx + dy * dy;

        if (distance < nearestDistance) {
            nearestDistance = distance;
            nearest = a;
        }
    }

    return nearest;
}

/* =========================
   PARTICLES
========================= */

function createParticles(
    x,
    y,
    count,
    type = "normal"
) {

    for (let i = 0; i < count; i++) {

        particles.push({
            x,
            y,
            vx: random(-100, 100),
            vy: random(-100, 100),
            life: random(0.3, 0.7),
            size: randomInt(1, 3),
            type
        });
    }
}

function drawParticle(p) {

    if (p.type === "shield") {
        ctx.fillStyle = "#61e8ff";
    } else {
        ctx.fillStyle = "#ffcc55";
    }

    ctx.fillRect(
        Math.round(p.x),
        Math.round(p.y),
        p.size,
        p.size
    );
}

/* =========================
   COLLISION
========================= */

function circleCollision(
    x1,
    y1,
    r1,
    x2,
    y2,
    r2
) {

    const dx = x1 - x2;
    const dy = y1 - y2;

    return (
        dx * dx + dy * dy <=
        (r1 + r2) * (r1 + r2)
    );
}

/* =========================
   ASTEROID HIT
========================= */

function hitAsteroid(index) {

    const a = asteroids[index];

    if (!a) {
        return;
    }

    /*
        ЩИТ:

        При столкновении:
        - жизнь НЕ теряется;
        - щит НЕ исчезает;
        - shieldTimer НЕ меняется;
        - астероид уничтожается;
        - следующие столкновения тоже будут защищены,
          пока не закончится исходные 5 секунд.
    */

    if (shieldTimer > 0) {

        createParticles(
            a.x,
            a.y,
            18,
            "shield"
        );

        asteroids.splice(index, 1);

        /*
            Небольшая защита от повторной обработки
            этого же столкновения.
            Сам таймер щита НЕ трогаем.
        */

        invulnerabilityTimer = 0.15;

        updateHUD();

        return;
    }

    /* обычное столкновение */

    createParticles(
        a.x,
        a.y,
        12,
        "normal"
    );

    asteroids.splice(index, 1);

    if (invulnerabilityTimer > 0) {
        return;
    }

    lives--;

    invulnerabilityTimer = 1.2;

    updateHUD();

    if (lives <= 0) {
        showGameOver();
    }
}

/* =========================
   UPDATE SHIP
========================= */

function updateShip(dt) {

    let direction = 0;

    if (keys.up) {
        direction -= 1;
    }

    if (keys.down) {
        direction += 1;
    }

    const speedMultiplier =
        speedTimer > 0 ? 1.75 : 1;

    ship.y +=
        direction *
        ship.speed *
        speedMultiplier *
        dt;

    if (ship.y < 15) {
        ship.y = 15;
    }

    if (ship.y > H - 15) {
        ship.y = H - 15;
    }

    speedAnimationTime += dt;
}

/* =========================
   UPDATE BULLETS
========================= */

function updateBullets(dt) {

    for (let i = bullets.length - 1; i >= 0; i--) {

        const b = bullets[i];

        b.x += b.vx * dt;
        b.y += b.vy * dt;

        b.life -= dt;

        let destroyed = false;

        for (let j = asteroids.length - 1; j >= 0; j--) {

            const a = asteroids[j];

            if (
                circleCollision(
                    b.x,
                    b.y,
                    3,
                    a.x,
                    a.y,
                    a.radius
                )
            ) {

                createParticles(
                    a.x,
                    a.y,
                    10,
                    "normal"
                );

                asteroids.splice(j, 1);
                bullets.splice(i, 1);

                score += 10;

                destroyed = true;

                break;
            }
        }

        if (destroyed) {
            continue;
        }

        if (
            b.life <= 0 ||
            b.x > W + 20 ||
            b.x < -20 ||
            b.y < -20 ||
            b.y > H + 20
        ) {
            bullets.splice(i, 1);
        }
    }
}

/* =========================
   UPDATE ASTEROIDS
========================= */

function updateAsteroids(dt) {

    for (let i = asteroids.length - 1; i >= 0; i--) {

        const a = asteroids[i];

        a.x -= a.speed * dt;

        a.rotation +=
            a.rotationSpeed * dt;

        if (
            circleCollision(
                ship.x,
                ship.y,
                11,
                a.x,
                a.y,
                a.radius
            )
        ) {

            hitAsteroid(i);

            continue;
        }

        if (a.x < -50) {
            asteroids.splice(i, 1);
        }
    }
}

/* =========================
   UPDATE COINS
========================= */

function updateCoins(dt) {

    for (let i = coins.length - 1; i >= 0; i--) {

        const c = coins[i];

        c.x -= c.speed * dt;

        c.rotation +=
            c.rotationSpeed * dt;

        if (
            circleCollision(
                ship.x,
                ship.y,
                12,
                c.x,
                c.y,
                c.radius
            )
        {

            score += 25;

            createParticles(
                c.x,
                c.y,
                8,
                "normal"
            );

            coins.splice(i, 1);

            continue;
        }

        if (c.x < -20) {
            coins.splice(i, 1);
        }
    }
}

/* =========================
   UPDATE POWERUPS
========================= */

function updatePowerups(dt) {

    for (let i = powerups.length - 1; i >= 0; i--) {

        const p = powerups[i];

        p.x -= p.speed * dt;

        if (
            circleCollision(
                ship.x,
                ship.y,
                13,
                p.x,
                p.y,
                11
            )
        {

            if (p.type === "shield") {

                /*
                    Щит ВСЕГДА получает новые полные 5 секунд.
                */

                shieldTimer = 5;

                createParticles(
                    p.x,
                    p.y,
                    15,
                    "shield"
                );

            } else {

                /*
                    Скорость получает полные 5 секунд.
                */

                speedTimer = 5;

                createParticles(
                    p.x,
                    p.y,
                    15,
                    "normal"
                );
            }

            powerups.splice(i, 1);

            updateHUD();

            continue;
        }

        if (p.x < -25) {
            powerups.splice(i, 1);
        }
    }
}

/* =========================
   UPDATE PARTICLES
========================= */

function updateParticles(dt) {

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.vx *= 0.97;
        p.vy *= 0.97;

        p.life -= dt;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

/* =========================
   UPDATE STARS
========================= */

function updateStars(dt) {

    for (const s of stars) {

        s.x -= s.speed * dt;

        if (s.x < 0) {

            s.x = W;

            s.y = random(0, H);
        }
    }
}

function drawStars() {

    for (const s of stars) {

        ctx.globalAlpha = s.brightness;

        ctx.fillStyle = "#ffffff";

        ctx.fillRect(
            Math.round(s.x),
            Math.round(s.y),
            s.size,
            s.size
        );
    }

    ctx.globalAlpha = 1;
}

/* =========================
   TIMERS
========================= */

function updateTimers(dt) {

    if (fireTimer > 0) {
        fireTimer -= dt;
    }

    if (invulnerabilityTimer > 0) {
        invulnerabilityTimer -= dt;
    }

    if (shieldTimer > 0) {

        shieldTimer -= dt;

        if (shieldTimer < 0) {
            shieldTimer = 0;
        }
    }

    if (speedTimer > 0) {

        speedTimer -= dt;

        if (speedTimer < 0) {
            speedTimer = 0;
        }
    }

    updateHUD();
}

/* =========================
   SPAWN SYSTEM
========================= */

function updateSpawning(dt) {

    spawnTimer -= dt;

    if (spawnTimer <= 0) {

        spawnAsteroid();

        spawnTimer =
            random(0.55, 1.15);
    }

    coinTimer -= dt;

    if (coinTimer <= 0) {

        spawnCoin();

        coinTimer =
            random(2.2, 4.2);
    }

    powerupTimer -= dt;

    if (powerupTimer <= 0) {

        spawnPowerup();

        powerupTimer =
            random(6, 11);
    }
}

/* =========================
   DRAW EVERYTHING
========================= */

function drawGame() {

    ctx.clearRect(0, 0, W, H);

    /* background */

    ctx.fillStyle = "#02030a";
    ctx.fillRect(0, 0, W, H);

    drawStars();

    /* asteroids */

    for (const a of asteroids) {
        drawAsteroid(a);
    }

    /* coins */

    for (const c of coins) {
        drawCoin(c);
    }

    /* powerups */

    for (const p of powerups) {
        drawPowerup(p);
    }

    /* bullets */

    for (const b of bullets) {
        drawBullet(b);
    }

    /* particles */

    for (const p of particles) {
        drawParticle(p);
    }

    /* ship */

    drawShip();
}

/* =========================
   MAIN LOOP
========================= */

function gameLoop(timestamp) {

    if (!gameRunning) {
        return;
    }

    if (!lastTime) {
        lastTime = timestamp;
    }

    let dt =
        (timestamp - lastTime) / 1000;

    lastTime = timestamp;

    dt = Math.min(dt, 0.04);

    if (!paused) {

        updateTimers(dt);
        updateShip(dt);
        updateBullets(dt);
        updateAsteroids(dt);
        updateCoins(dt);
        updatePowerups(dt);
        updateParticles(dt);
        updateStars(dt);
        updateSpawning(dt);

        if (keys.fire) {
            fireBullet();
        }

    }

    drawGame();

    requestAnimationFrame(gameLoop);
}

/* =========================
   START
========================= */

function startGame() {

    resetGame();

    gameRunning = true;
    paused = false;

    startOverlay.classList.add("hidden");
    pauseOverlay.classList.add("hidden");
    gameOverOverlay.classList.add("hidden");

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}

/* =========================
   PAUSE
========================= */

function pauseGame() {

    if (!gameRunning) {
        return;
    }

    paused = true;

    pauseOverlay.classList.remove("hidden");
}

function resumeGame() {

    if (!gameRunning) {
        return;
    }

    paused = false;

    pauseOverlay.classList.add("hidden");

    lastTime = performance.now();
}

/* =========================
   GAME OVER
========================= */

function showGameOver() {

    gameRunning = false;
    paused = false;

    keys.up = false;
    keys.down = false;
    keys.fire = false;

    finalScore.textContent =
        "SCORE: " + score;

    gameOverOverlay.classList.remove("hidden");
}

/* =========================
   CHEAT
========================= */

function activateCheat() {

    const code =
        cheatInput.value.trim().toUpperCase();

    if (code === "ASTRO-AIM") {

        autoAim = true;

        cheatMessage.textContent =
            "AUTO-AIM ACTIVATED";

        cheatMessage.style.color =
            "#55ff77";

    } else {

        cheatMessage.textContent =
            "UNKNOWN CHEAT";

        cheatMessage.style.color =
            "#ff5555";
    }
}

/* =========================
   BUTTON EVENTS
========================= */

startButton.addEventListener(
    "click",
    startGame
);

restartButton.addEventListener(
    "click",
    startGame
);

pauseButton.addEventListener(
    "click",
    pauseGame
);

resumeButton.addEventListener(
    "click",
    resumeGame
);

activateCheatButton.addEventListener(
    "click",
    activateCheat
);

/* =========================
   TOUCH / POINTER CONTROLS
========================= */

function bindHoldButton(button, key) {

    button.addEventListener(
        "pointerdown",
        function(e) {

            e.preventDefault();

            keys[key] = true;

            try {
                button.setPointerCapture(e.pointerId);
            } catch (_) {}
        }
    );

    const release = function(e) {

        e.preventDefault();

        keys[key] = false;
    };

    button.addEventListener(
        "pointerup",
        release
    );

    button.addEventListener(
        "pointercancel",
        release
    );

    button.addEventListener(
        "pointerleave",
        function(e) {

            if (e.buttons === 0) {
                keys[key] = false;
            }
        }
    );
}

bindHoldButton(upButton, "up");
bindHoldButton(downButton, "down");
bindHoldButton(fireButton, "fire");

/* =========================
   KEYBOARD
========================= */

window.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "ArrowUp" ||
            e.key.toLowerCase() === "w"
        ) {
            keys.up = true;
            e.preventDefault();
        }

        if (
            e.key === "ArrowDown" ||
            e.key.toLowerCase() === "s"
        ) {
            keys.down = true;
            e.preventDefault();
        }

        if (
            e.key === " " ||
            e.key.toLowerCase() === "f"
        ) {
            keys.fire = true;
            e.preventDefault();
        }

        if (
            e.key === "Escape" ||
            e.key.toLowerCase() === "p"
        ) {

            if (paused) {
                resumeGame();
            } else {
                pauseGame();
            }

            e.preventDefault();
        }
    }
);

window.addEventListener(
    "keyup",
    function(e) {

        if (
            e.key === "ArrowUp" ||
            e.key.toLowerCase() === "w"
        ) {
            keys.up = false;
        }

        if (
            e.key === "ArrowDown" ||
            e.key.toLowerCase() === "s"
        ) {
            keys.down = false;
        }

        if (
            e.key === " " ||
            e.key.toLowerCase() === "f"
        ) {
            keys.fire = false;
        }
    }
);

/* =========================
   PREVENT LONG PRESS
========================= */

document.addEventListener(
    "contextmenu",
    function(e) {

        if (e.target !== cheatInput) {
            e.preventDefault();
        }
    }
);

/* =========================
   INITIALIZE
========================= */

createStars();
resetGame();

</script>
