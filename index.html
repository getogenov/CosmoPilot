<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>CosmoPilot</title>

<style>
* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030a;
    font-family: monospace;
    touch-action: none;
}

button,
canvas {
    touch-action: none;
}

input {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
}

#gameCanvas {
    position: fixed;
    left: 50%;
    top: 50%;

    width: min(100vw, 177.78vh);
    height: min(56.25vw, 100vh);

    transform: translate(-50%, -50%);

    background: #02030a;

    image-rendering: pixelated;
    image-rendering: crisp-edges;
}

#creator {
    position: fixed;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);

    color: white;
    font-size: 10px;
    letter-spacing: 2px;

    z-index: 20;
    pointer-events: none;

    text-shadow: 2px 2px #000;
}

/* ================= HUD ================= */

#hud {
    position: fixed;
    top: 25px;
    left: 12px;
    right: 12px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    z-index: 20;
    pointer-events: none;
}

.hud {
    color: white;
    font-size: 13px;
    text-shadow: 2px 2px #000;
}

#lives {
    display: flex;
    gap: 5px;
    align-items: center;
}

.heart {
    width: 12px;
    height: 11px;
    background: #ff3030;

    display: inline-block;

    clip-path: polygon(
        0 25%,
        25% 25%,
        25% 0,
        50% 0,
        50% 12%,
        75% 0,
        100% 0,
        100% 50%,
        75% 50%,
        75% 75%,
        50% 100%,
        25% 75%,
        0 50%
    );
}

.heart.empty {
    background: #30313a;
}

#pauseButton {
    width: 44px;
    height: 34px;

    border: 2px solid white;
    border-radius: 4px;

    background: #111827;
    color: white;

    font-family: monospace;
    font-size: 16px;
    font-weight: bold;

    pointer-events: auto;
}

/* ================= CONTROLS ================= */

#controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 14px;

    z-index: 20;

    pointer-events: none;
}

#movement {
    position: absolute;
    left: 17px;
    bottom: 0;

    display: flex;
    flex-direction: column;
    gap: 7px;

    pointer-events: auto;
}

.control {
    width: 55px;
    height: 45px;

    border: 2px solid white;
    border-radius: 5px;

    background: rgba(12, 20, 38, 0.9);
    color: white;

    font-family: monospace;
    font-size: 22px;
    font-weight: bold;
}

#fireButton {
    position: absolute;

    right: 17px;
    bottom: 0;

    width: 76px;
    height: 54px;

    border: 2px solid white;
    border-radius: 5px;

    background: rgba(60, 20, 20, 0.95);

    pointer-events: auto;
}

/* пиксельная пуля */

#fireButton::before {
    content: "";

    position: absolute;

    left: 18px;
    top: 22px;

    width: 35px;
    height: 8px;

    background: white;

    box-shadow:
        7px 0 #ffffff,
        14px 0 #ffe45a,
        21px 0 #ff9b32;
}

#fireButton::after {
    content: "";

    position: absolute;

    left: 14px;
    top: 19px;

    width: 5px;
    height: 14px;

    background: white;
}

/* ================= OVERLAYS ================= */

.overlay {
    position: fixed;
    inset: 0;

    z-index: 50;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.82);
}

.hidden {
    display: none !important;
}

.panel {
    width: min(88vw, 380px);

    padding: 25px;

    border: 3px solid white;

    background: #090d18;
    color: white;

    text-align: center;

    box-shadow: 0 0 0 4px #172033;
}

.panel h1 {
    margin: 0 0 15px;

    font-size: 28px;
}

.panel p {
    font-size: 13px;
    line-height: 1.5;
}

.mainButton {
    width: 100%;
    min-height: 46px;

    margin-top: 12px;

    border: 2px solid white;
    border-radius: 3px;

    background: #182338;
    color: white;

    font-family: monospace;
    font-size: 15px;
    font-weight: bold;

    touch-action: manipulation;
}

.mainButton:active,
.control:active,
#fireButton:active,
#pauseButton:active {
    transform: scale(0.94);
}

/* ================= CHEAT ================= */

#cheatInput {
    width: 100%;
    height: 42px;

    margin-top: 15px;
    padding: 8px;

    border: 2px solid #777;

    background: #02030a;
    color: white;

    font-family: monospace;
    text-align: center;

    text-transform: uppercase;
}

#cheatMessage {
    min-height: 18px;
    margin-top: 8px;

    font-size: 11px;
}

/* ================= PORTRAIT ================= */

#portraitWarning {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    background: #02030a;
    color: white;

    text-align: center;
}

.portraitBox {
    padding: 25px;
    border: 3px solid white;
}

#phoneIcon {
    width: 34px;
    height: 55px;

    margin: 0 auto 18px;

    border: 4px solid white;
}

@media (orientation: portrait) {
    #portraitWarning {
        display: flex;
    }
}
</style>
</head>

<body>

<canvas id="gameCanvas" width="480" height="270"></canvas>

<div id="creator">
    CREATED BY GETOGENOV
</div>

<!-- HUD -->

<div id="hud">

    <div class="hud" id="lives"></div>

    <div class="hud" id="score">
        SCORE: 0
    </div>

    <div class="hud" id="power"></div>

    <button id="pauseButton">
        II
    </button>

</div>

<!-- CONTROLS -->

<div id="controls">

    <div id="movement">

        <button class="control" id="upButton">
            ▲
        </button>

        <button class="control" id="downButton">
            ▼
        </button>

    </div>

    <button id="fireButton"></button>

</div>

<!-- START -->

<div class="overlay" id="startScreen">

    <div class="panel">

        <h1>COSMOPILOT</h1>

        <p>
            SPACE PILOT<br><br>
            Destroy asteroids.<br>
            Collect coins and power-ups.
        </p>

        <button class="mainButton" id="startButton">
            START GAME
        </button>

    </div>

</div>

<!-- PAUSE -->

<div class="overlay hidden" id="pauseScreen">

    <div class="panel">

        <h1>PAUSED</h1>

        <button class="mainButton" id="resumeButton">
            RESUME
        </button>

        <input
            id="cheatInput"
            type="text"
            placeholder="ENTER CHEAT"
            maxlength="30"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
        >

        <button
            class="mainButton"
            id="cheatButton"
        >
            ACTIVATE CHEAT
        </button>

        <div id="cheatMessage"></div>

    </div>

</div>

<!-- GAME OVER -->

<div class="overlay hidden" id="gameOverScreen">

    <div class="panel">

        <h1>GAME OVER</h1>

        <p id="finalScore">
            SCORE: 0
        </p>

        <button class="mainButton" id="restartButton">
            PLAY AGAIN
        </button>

    </div>

</div>

<!-- PORTRAIT -->

<div id="portraitWarning">

    <div class="portraitBox">

        <div id="phoneIcon"></div>

        TURN YOUR PHONE<br>
        HORIZONTALLY

    </div>

</div>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

ctx.imageSmoothingEnabled = false;


/* =====================================================
   UI
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const pauseScreen =
    document.getElementById("pauseScreen");

const gameOverScreen =
    document.getElementById("gameOverScreen");

const startButton =
    document.getElementById("startButton");

const resumeButton =
    document.getElementById("resumeButton");

const restartButton =
    document.getElementById("restartButton");

const pauseButton =
    document.getElementById("pauseButton");

const upButton =
    document.getElementById("upButton");

const downButton =
    document.getElementById("downButton");

const fireButton =
    document.getElementById("fireButton");

const livesElement =
    document.getElementById("lives");

const scoreElement =
    document.getElementById("score");

const powerElement =
    document.getElementById("power");

const finalScoreElement =
    document.getElementById("finalScore");

const cheatInput =
    document.getElementById("cheatInput");

const cheatButton =
    document.getElementById("cheatButton");

const cheatMessage =
    document.getElementById("cheatMessage");


/* =====================================================
   GAME VARIABLES
===================================================== */

let running = false;
let paused = false;

let score = 0;
let lives = 3;

let lastTime = 0;

let asteroidTimer = 0;
let coinTimer = 0;
let powerupTimer = 0;

let fireTimer = 0;

let invulnerabilityTimer = 0;

let shieldTimer = 0;
let speedTimer = 0;

let autoAim = false;

let speedAnimation = 0;


/* =====================================================
   INPUT
===================================================== */

const input = {
    up: false,
    down: false,
    fire: false
};


/* =====================================================
   SHIP
===================================================== */

const ship = {
    x: 65,
    y: H / 2,

    speed: 150,

    width: 25,
    height: 18
};


/* =====================================================
   GAME ARRAYS
===================================================== */

let asteroids = [];
let bullets = [];
let coins = [];
let powerups = [];
let particles = [];
let stars = [];


/* =====================================================
   RANDOM
===================================================== */

function rand(min, max) {
    return Math.random() * (max - min) + min;
}


/* =====================================================
   RESET
===================================================== */

function resetGame() {

    score = 0;
    lives = 3;

    ship.x = 65;
    ship.y = H / 2;

    asteroids = [];
    bullets = [];
    coins = [];
    powerups = [];
    particles = [];
    stars = [];

    asteroidTimer = 0.5;
    coinTimer = 2;
    powerupTimer = 5;

    fireTimer = 0;

    invulnerabilityTimer = 0;

    shieldTimer = 0;
    speedTimer = 0;

    autoAim = false;

    speedAnimation = 0;

    createStars();

    updateHUD();
}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    livesElement.innerHTML = "";

    for (let i = 0; i < 3; i++) {

        const heart =
            document.createElement("span");

        heart.className = "heart";

        if (i >= lives) {
            heart.classList.add("empty");
        }

        livesElement.appendChild(heart);
    }

    scoreElement.textContent =
        "SCORE: " + score;

    let text = "";

    if (shieldTimer > 0) {

        text +=
            "SHIELD " +
            shieldTimer.toFixed(1);
    }

    if (speedTimer > 0) {

        if (text !== "") {
            text += " | ";
        }

        text +=
            "SPEED " +
            speedTimer.toFixed(1);
    }

    powerElement.textContent = text;
}


/* =====================================================
   STARS
===================================================== */

function createStars() {

    for (let i = 0; i < 90; i++) {

        stars.push({
            x: rand(0, W),
            y: rand(0, H),
            size: Math.random() < 0.8 ? 1 : 2,
            speed: rand(8, 30),
            alpha: rand(0.3, 1)
        });
    }
}

function updateStars(dt) {

    for (const star of stars) {

        star.x -= star.speed * dt;

        if (star.x < 0) {

            star.x = W;
            star.y = rand(0, H);
        }
    }
}

function drawStars() {

    for (const star of stars) {

        ctx.globalAlpha = star.alpha;

        ctx.fillStyle = "#ffffff";

        ctx.fillRect(
            Math.floor(star.x),
            Math.floor(star.y),
            star.size,
            star.size
        );
    }

    ctx.globalAlpha = 1;
}


/* =====================================================
   SHIP
===================================================== */

function drawShip() {

    const x = Math.floor(ship.x);
    const y = Math.floor(ship.y);

    ctx.save();

    if (invulnerabilityTimer > 0) {

        if (
            Math.floor(invulnerabilityTimer * 12) % 2 === 0
        ) {
            ctx.globalAlpha = 0.35;
        }
    }

    /* engine */

    ctx.fillStyle = "#ff9d32";

    ctx.fillRect(
        x - 17,
        y - 3,
        7,
        6
    );

    ctx.fillStyle = "#fff04c";

    ctx.fillRect(
        x - 23,
        y - 2,
        6,
        4
    );

    /* wings */

    ctx.fillStyle = "#68789e";

    ctx.fillRect(
        x - 7,
        y - 9,
        12,
        5
    );

    ctx.fillRect(
        x - 7,
        y + 4,
        12,
        5
    );

    /* body */

    ctx.fillStyle = "#dce5ff";

    ctx.fillRect(
        x - 2,
        y - 7,
        16,
        14
    );

    ctx.fillRect(
        x + 12,
        y - 4,
        8,
        8
    );

    /* nose */

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        x + 19,
        y - 1,
        6,
        2
    );

    /* cockpit */

    ctx.fillStyle = "#29d9ff";

    ctx.fillRect(
        x + 2,
        y - 4,
        7,
        8
    );

    ctx.fillStyle = "#b9f8ff";

    ctx.fillRect(
        x + 4,
        y - 3,
        2,
        2
    );

    ctx.restore();

    drawShield();

    if (speedTimer > 0) {
        drawSpeedTrail();
    }
}


/* =====================================================
   SHIELD
===================================================== */

function drawShield() {

    if (shieldTimer <= 0) {
        return;
    }

    const pulse =
        Math.sin(performance.now() * 0.008) * 2;

    ctx.save();

    ctx.strokeStyle = "#4bdcff";
    ctx.lineWidth = 2;

    ctx.globalAlpha =
        0.65 +
        Math.sin(performance.now() * 0.01) * 0.15;

    ctx.beginPath();

    ctx.arc(
        ship.x + 2,
        ship.y,
        23 + pulse,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    ctx.restore();
}


/* =====================================================
   SPEED TRAIL
===================================================== */

function drawSpeedTrail() {

    ctx.save();

    for (let i = 0; i < 14; i++) {

        const offset =
            (speedAnimation * 120 + i * 22) % 120;

        const x =
            ship.x - 18 - offset;

        const y =
            ship.y +
            ((i % 5) - 2) * 4;

        const length =
            8 + (i % 4) * 4;

        const green =
            Math.floor(
                180 +
                Math.sin(speedAnimation * 7 + i) * 60
            );

        ctx.fillStyle =
            "rgb(255," +
            green +
            ",40)";

        ctx.globalAlpha =
            0.15 +
            (1 - offset / 120) * 0.65;

        ctx.fillRect(
            Math.floor(x),
            Math.floor(y),
            length,
            2
        );
    }

    ctx.restore();
}


/* =====================================================
   ASTEROIDS
===================================================== */

function spawnAsteroid() {

    const radius =
        rand(10, 22);

    const count = 8;

    const vertices = [];

    for (let i = 0; i < count; i++) {

        const angle =
            (Math.PI * 2 / count) * i;

        const r =
            radius * rand(0.72, 1.18);

        vertices.push({
            x: Math.cos(angle) * r,
            y: Math.sin(angle) * r
        });
    }

    asteroids.push({

        x: W + radius,

        y: rand(
            25,
            H - 25
        ),

        radius,

        speed: rand(55, 105),

        rotation: rand(0, Math.PI * 2),

        rotationSpeed: rand(-1, 1),

        vertices
    });
}


function drawAsteroid(a) {

    ctx.save();

    ctx.translate(
        Math.floor(a.x),
        Math.floor(a.y)
    );

    ctx.rotate(a.rotation);

    ctx.fillStyle = "#686e7a";

    ctx.beginPath();

    for (let i = 0; i < a.vertices.length; i++) {

        const v =
            a.vertices[i];

        if (i === 0) {
            ctx.moveTo(v.x, v.y);
        } else {
            ctx.lineTo(v.x, v.y);
        }
    }

    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle = "#9ba2ad";

    ctx.stroke();

    /* craters */

    ctx.fillStyle = "#454a54";

    ctx.fillRect(
        -a.radius * 0.45,
        -a.radius * 0.25,
        5,
        4
    );

    ctx.fillRect(
        a.radius * 0.15,
        -a.radius * 0.55,
        4,
        4
    );

    ctx.fillRect(
        a.radius * 0.2,
        a.radius * 0.2,
        5,
        4
    );

    ctx.restore();
}


/* =====================================================
   COINS
===================================================== */

function spawnCoin() {

    coins.push({

        x: W + 10,

        y: rand(
            25,
            H - 25
        ),

        speed: rand(70, 100),

        rotation: rand(
            0,
            Math.PI * 2
        ),

        rotationSpeed: rand(5, 8),

        radius: 6
    });
}


function drawCoin(c) {

    ctx.save();

    ctx.translate(
        Math.floor(c.x),
        Math.floor(c.y)
    );

    const width =
        Math.max(
            2,
            Math.abs(
                Math.cos(c.rotation)
            ) * 7
        );

    ctx.fillStyle = "#ffe344";

    ctx.fillRect(
        -width / 2,
        -6,
        width,
        12
    );

    ctx.fillStyle = "#fff7a6";

    ctx.fillRect(
        -width / 2,
        -4,
        Math.max(
            1,
            width / 2
        ),
        2
    );

    ctx.restore();
}


/* =====================================================
   POWERUPS
===================================================== */

function spawnPowerup() {

    const type =
        Math.random() < 0.5
            ? "shield"
            : "speed";

    powerups.push({

        x: W + 15,

        y: rand(
            30,
            H - 30
        ),

        speed: 75,

        type
    });
}


function drawPowerup(p) {

    ctx.save();

    ctx.translate(
        Math.floor(p.x),
        Math.floor(p.y)
    );

    if (p.type === "shield") {

        /* pixel shield */

        ctx.fillStyle = "#45d8ff";

        ctx.fillRect(
            -3,
            -9,
            6,
            18
        );

        ctx.fillRect(
            -7,
            -5,
            14,
            10
        );

        ctx.fillStyle = "#aaf4ff";

        ctx.fillRect(
            -2,
            -5,
            4,
            10
        );

    } else {

        /* speed arrows */

        ctx.fillStyle = "#ffe600";

        ctx.fillRect(
            -10,
            -6,
            8,
            3
        );

        ctx.fillRect(
            -5,
            -3,
            8,
            3
        );

        ctx.fillRect(
            -1,
            0,
            6,
            3
        );

        ctx.fillRect(
            2,
            -6,
            8,
            3
        );

        ctx.fillRect(
            7,
            -3,
            8,
            3
        );

        ctx.fillRect(
            11,
            0,
            5,
            3
        );
    }

    ctx.restore();
}


/* =====================================================
   BULLETS
===================================================== */

function nearestAsteroid() {

    let target = null;
    let best = Infinity;

    for (const asteroid of asteroids) {

        if (
            asteroid.x <
            ship.x - 10
        ) {
            continue;
        }

        const dx =
            asteroid.x - ship.x;

        const dy =
            asteroid.y - ship.y;

        const distance =
            dx * dx + dy * dy;

        if (distance < best) {

            best = distance;
            target = asteroid;
        }
    }

    return target;
}


function shoot() {

    if (fireTimer > 0) {
        return;
    }

    fireTimer = 0.28;

    let vx = 330;
    let vy = 0;

    if (autoAim) {

        const target =
            nearestAsteroid();

        if (target) {

            const dx =
                target.x - ship.x;

            const dy =
                target.y - ship.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                ) || 1;

            vx =
                dx / distance * 330;

            vy =
                dy / distance * 330;
        }
    }

    bullets.push({

        x: ship.x + 24,

        y: ship.y,

        vx,
        vy,

        life: 2
    });
}


function drawBullet(b) {

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        Math.floor(b.x),
        Math.floor(b.y),
        6,
        2
    );

    ctx.fillStyle = "#ffe35a";

    ctx.fillRect(
        Math.floor(b.x + 3),
        Math.floor(b.y),
        4,
        2
    );
}


/* =====================================================
   PARTICLES
===================================================== */

function particlesCreate(
    x,
    y,
    amount,
    type
) {

    for (let i = 0; i < amount; i++) {

        particles.push({

            x,
            y,

            vx: rand(-100, 100),
            vy: rand(-100, 100),

            life: rand(0.25, 0.65),

            size:
                Math.random() < 0.7
                    ? 2
                    : 3,

            type
        });
    }
}


function drawParticle(p) {

    if (p.type === "shield") {
        ctx.fillStyle = "#62e7ff";
    } else {
        ctx.fillStyle = "#ffd34d";
    }

    ctx.fillRect(
        Math.floor(p.x),
        Math.floor(p.y),
        p.size,
        p.size
    );
}


/* =====================================================
   COLLISION
===================================================== */

function collision(
    x1,
    y1,
    r1,
    x2,
    y2,
    r2
) {

    const dx =
        x1 - x2;

    const dy =
        y1 - y2;

    return (
        dx * dx +
        dy * dy <=
        (r1 + r2) *
        (r1 + r2)
    );
}


/* =====================================================
   SHIP / ASTEROID COLLISION
===================================================== */

function asteroidHit(index) {

    const asteroid =
        asteroids[index];

    if (!asteroid) {
        return;
    }

    /*
        ЩИТ:

        - столкновение не снимает щит;
        - таймер не меняется;
        - жизнь не теряется;
        - астероид уничтожается.

        Щит продолжает работать до окончания
        своих исходных 5 секунд.
    */

    if (shieldTimer > 0) {

        particlesCreate(
            asteroid.x,
            asteroid.y,
            18,
            "shield"
        );

        asteroids.splice(
            index,
            1
        );

        invulnerabilityTimer = 0.12;

        return;
    }

    /* обычное столкновение */

    particlesCreate(
        asteroid.x,
        asteroid.y,
        14,
        "normal"
    );

    asteroids.splice(
        index,
        1
    );

    if (invulnerabilityTimer > 0) {
        return;
    }

    lives--;

    invulnerabilityTimer = 1.2;

    updateHUD();

    if (lives <= 0) {
        gameOver();
    }
}


/* =====================================================
   UPDATE SHIP
===================================================== */

function updateShip(dt) {

    let direction = 0;

    if (input.up) {
        direction--;
    }

    if (input.down) {
        direction++;
    }

    const multiplier =
        speedTimer > 0
            ? 1.75
            : 1;

    ship.y +=
        direction *
        ship.speed *
        multiplier *
        dt;

    if (ship.y < 15) {
        ship.y = 15;
    }

    if (ship.y > H - 15) {
        ship.y = H - 15;
    }

    speedAnimation += dt;
}


/* =====================================================
   UPDATE BULLETS
===================================================== */

function updateBullets(dt) {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];

        bullet.x +=
            bullet.vx * dt;

        bullet.y +=
            bullet.vy * dt;

        bullet.life -= dt;

        let hit = false;

        for (
            let j = asteroids.length - 1;
            j >= 0;
            j--
        ) {

            const asteroid =
                asteroids[j];

            if (
                collision(
                    bullet.x,
                    bullet.y,
                    3,
                    asteroid.x,
                    asteroid.y,
                    asteroid.radius
                )
            ) {

                particlesCreate(
                    asteroid.x,
                    asteroid.y,
                    12,
                    "normal"
                );

                asteroids.splice(
                    j,
                    1
                );

                bullets.splice(
                    i,
                    1
                );

                score += 10;

                updateHUD();

                hit = true;

                break;
            }
        }

        if (hit) {
            continue;
        }

        if (
            bullet.life <= 0 ||
            bullet.x > W + 30 ||
            bullet.y < -30 ||
            bullet.y > H + 30
        ) {

            bullets.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   UPDATE ASTEROIDS
===================================================== */

function updateAsteroids(dt) {

    for (
        let i = asteroids.length - 1;
        i >= 0;
        i--
    ) {

        const asteroid =
            asteroids[i];

        asteroid.x -=
            asteroid.speed * dt;

        asteroid.rotation +=
            asteroid.rotationSpeed * dt;

        if (
            collision(
                ship.x,
                ship.y,
                11,
                asteroid.x,
                asteroid.y,
                asteroid.radius
            )
        ) {

            asteroidHit(i);

            continue;
        }

        if (asteroid.x < -50) {

            asteroids.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   UPDATE COINS
===================================================== */

function updateCoins(dt) {

    for (
        let i = coins.length - 1;
        i >= 0;
        i--
    ) {

        const coin =
            coins[i];

        coin.x -=
            coin.speed * dt;

        coin.rotation +=
            coin.rotationSpeed * dt;

        if (
            collision(
                ship.x,
                ship.y,
                12,
                coin.x,
                coin.y,
                coin.radius
            )
        ) {

            score += 25;

            particlesCreate(
                coin.x,
                coin.y,
                8,
                "normal"
            );

            coins.splice(
                i,
                1
            );

            updateHUD();

            continue;
        }

        if (coin.x < -20) {

            coins.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   UPDATE POWERUPS
===================================================== */

function updatePowerups(dt) {

    for (
        let i = powerups.length - 1;
        i >= 0;
        i--
    ) {

        const power =
            powerups[i];

        power.x -=
            power.speed * dt;

        if (
            collision(
                ship.x,
                ship.y,
                13,
                power.x,
                power.y,
                11
            )
        ) {

            if (
                power.type ===
                "shield"
            ) {

                /*
                    Всегда полные 5 секунд.
                */

                shieldTimer = 5;

                particlesCreate(
                    power.x,
                    power.y,
                    18,
                    "shield"
                );

            } else {

                speedTimer = 5;

                particlesCreate(
                    power.x,
                    power.y,
                    18,
                    "normal"
                );
            }

            powerups.splice(
                i,
                1
            );

            updateHUD();

            continue;
        }

        if (power.x < -30) {

            powerups.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   UPDATE PARTICLES
===================================================== */

function updateParticles(dt) {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const particle =
            particles[i];

        particle.x +=
            particle.vx * dt;

        particle.y +=
            particle.vy * dt;

        particle.vx *= 0.97;
        particle.vy *= 0.97;

        particle.life -= dt;

        if (particle.life <= 0) {

            particles.splice(
                i,
                1
            );
        }
    }
}


/* =====================================================
   TIMERS
===================================================== */

function updateTimers(dt) {

    if (fireTimer > 0) {
        fireTimer -= dt;
    }

    if (invulnerabilityTimer > 0) {
        invulnerabilityTimer -= dt;
    }

    if (shieldTimer > 0) {

        shieldTimer -= dt;

        if (shieldTimer < 0) {
            shieldTimer = 0;
        }
    }

    if (speedTimer > 0) {

        speedTimer -= dt;

        if (speedTimer < 0) {
            speedTimer = 0;
        }
    }

    updateHUD();
}


/* =====================================================
   SPAWN
===================================================== */

function updateSpawning(dt) {

    asteroidTimer -= dt;

    if (asteroidTimer <= 0) {

        spawnAsteroid();

        asteroidTimer =
            rand(0.55, 1.1);
    }

    coinTimer -= dt;

    if (coinTimer <= 0) {

        spawnCoin();

        coinTimer =
            rand(2, 4);
    }

    powerupTimer -= dt;

    if (powerupTimer <= 0) {

        spawnPowerup();

        powerupTimer =
            rand(6, 10);
    }
}


/* =====================================================
   DRAW GAME
===================================================== */

function drawGame() {

    ctx.fillStyle = "#02030a";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    drawStars();

    for (const asteroid of asteroids) {
        drawAsteroid(asteroid);
    }

    for (const coin of coins) {
        drawCoin(coin);
    }

    for (const power of powerups) {
        drawPowerup(power);
    }

    for (const bullet of bullets) {
        drawBullet(bullet);
    }

    for (const particle of particles) {
        drawParticle(particle);
    }

    drawShip();
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time) {

    if (!running) {
        return;
    }

    if (lastTime === 0) {
        lastTime = time;
    }

    let dt =
        (time - lastTime) / 1000;

    lastTime = time;

    if (dt > 0.04) {
        dt = 0.04;
    }

    if (!paused) {

        updateTimers(dt);

        updateShip(dt);

        updateBullets(dt);

        updateAsteroids(dt);

        updateCoins(dt);

        updatePowerups(dt);

        updateParticles(dt);

        updateStars(dt);

        updateSpawning(dt);

        if (input.fire) {
            shoot();
        }
    }

    drawGame();

    requestAnimationFrame(gameLoop);
}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    console.log("START GAME");

    resetGame();

    running = true;
    paused = false;

    startScreen.classList.add(
        "hidden"
    );

    pauseScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );

    lastTime = 0;

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   PAUSE
===================================================== */

function pauseGame() {

    if (!running) {
        return;
    }

    paused = true;

    pauseScreen.classList.remove(
        "hidden"
    );
}


function resumeGame() {

    if (!running) {
        return;
    }

    paused = false;

    pauseScreen.classList.add(
        "hidden"
    );

    lastTime = performance.now();
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

    running = false;
    paused = false;

    input.up = false;
    input.down = false;
    input.fire = false;

    finalScoreElement.textContent =
        "SCORE: " + score;

    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* =====================================================
   CHEAT
===================================================== */

function activateCheat() {

    const code =
        cheatInput.value
            .trim()
            .toUpperCase();

    if (code === "ASTRO-AIM") {

        autoAim = true;

        cheatMessage.textContent =
            "AUTO-AIM ACTIVATED";

        cheatMessage.style.color =
            "#55ff77";

    } else {

        cheatMessage.textContent =
            "UNKNOWN CHEAT";

        cheatMessage.style.color =
            "#ff5555";
    }
}


/* =====================================================
   BUTTONS
===================================================== */

startButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        startGame();
    }
);


restartButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        startGame();
    }
);


pauseButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        if (paused) {
            resumeGame();
        } else {
            pauseGame();
        }
    }
);


resumeButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        resumeGame();
    }
);


cheatButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        activateCheat();
    }
);


/* =====================================================
   TOUCH CONTROLS
===================================================== */

function holdButton(
    button,
    property
) {

    function start(event) {

        event.preventDefault();

        input[property] = true;

        try {
            button.setPointerCapture(
                event.pointerId
            );
        } catch (error) {}
    }

    function stop(event) {

        event.preventDefault();

        input[property] = false;
    }

    button.addEventListener(
        "pointerdown",
        start
    );

    button.addEventListener(
        "pointerup",
        stop
    );

    button.addEventListener(
        "pointercancel",
        stop
    );

    button.addEventListener(
        "lostpointercapture",
        stop
    );
}


holdButton(
    upButton,
    "up"
);

holdButton(
    downButton,
    "down"
);

holdButton(
    fireButton,
    "fire"
);


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        if (
            key === "arrowup" ||
            key === "w"
        ) {

            input.up = true;

            event.preventDefault();
        }

        if (
            key === "arrowdown" ||
            key === "s"
        ) {

            input.down = true;

            event.preventDefault();
        }

        if (
            key === " " ||
            key === "f"
        ) {

            input.fire = true;

            event.preventDefault();
        }

        if (
            key === "p" ||
            key === "escape"
        ) {

            if (paused) {
                resumeGame();
            } else {
                pauseGame();
            }

            event.preventDefault();
        }
    }
);


window.addEventListener(
    "keyup",
    function(event) {

        const key =
            event.key.toLowerCase();

        if (
            key === "arrowup" ||
            key === "w"
        ) {
            input.up = false;
        }

        if (
            key === "arrowdown" ||
            key === "s"
        ) {
            input.down = false;
        }

        if (
            key === " " ||
            key === "f"
        ) {
            input.fire = false;
        }
    }
);


/* =====================================================
   PREVENT LONG PRESS MENU
===================================================== */

document.addEventListener(
    "contextmenu",
    function(event) {

        if (
            event.target !== cheatInput
        ) {
            event.preventDefault();
        }
    }
);


/* =====================================================
   INITIALIZE
===================================================== */

resetGame();

</script>
