<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Space Pilot</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030a;
    color: white;
    font-family: monospace;
    touch-action: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#gameWrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #02030a;
}

#game {
    position: relative;
    width: min(100vw, 1100px);
    height: min(100vh, 620px);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #02030a;
    border: 2px solid #26314f;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}

#creator {
    position: absolute;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;

    color: #9aff78;
    font-size: clamp(8px, 1.5vw, 14px);
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow:
        2px 0 #10240d,
        -1px 0 #10240d,
        0 2px #10240d;

    pointer-events: none;
    white-space: nowrap;
}

#hud {
    position: absolute;
    top: 28px;
    left: 10px;
    right: 10px;
    z-index: 20;

    display: flex;
    justify-content: space-between;
    align-items: center;

    font-size: clamp(10px, 2vw, 17px);
    font-weight: bold;
    text-shadow: 2px 2px #000;
    pointer-events: none;
}

.hudLeft,
.hudRight {
    display: flex;
    align-items: center;
    gap: 12px;
}

#pauseButton {
    pointer-events: auto;
    border: 1px solid #7783a8;
    background: #11172a;
    color: white;
    font-family: monospace;
    font-weight: bold;
    font-size: clamp(10px, 2vw, 16px);

    min-width: 42px;
    min-height: 38px;

    cursor: pointer;
    border-radius: 5px;
}

#pauseButton:active {
    transform: scale(.94);
    background: #26314f;
}

.status {
    display: none;
    padding: 3px 6px;
    border: 1px solid currentColor;
    border-radius: 3px;
}

#speedStatus {
    color: #ffe44a;
}

#shieldStatus {
    color: #62d8ff;
}

#aimStatus {
    color: #ff76f4;
}

#controls {
    position: absolute;
    inset: 0;
    z-index: 30;
    pointer-events: none;
}

.controlButton {
    position: absolute;
    bottom: 14px;

    width: clamp(50px, 10vw, 72px);
    height: clamp(45px, 9vw, 64px);

    border: 2px solid #66749d;
    border-radius: 7px;

    background: rgba(15, 21, 40, .82);
    color: white;

    font-family: monospace;
    font-size: clamp(15px, 3vw, 25px);
    font-weight: bold;

    pointer-events: auto;
    user-select: none;
    -webkit-user-select: none;
}

.controlButton:active {
    background: rgba(65, 79, 125, .95);
    transform: scale(.94);
}

#upButton {
    left: 14px;
}

#downButton {
    left: 14px;
    bottom: 82px;
}

#fireButton {
    right: 14px;
    width: clamp(65px, 13vw, 95px);
}

#menu,
#gameOver,
#pauseMenu {
    position: absolute;
    inset: 0;
    z-index: 100;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at center,
        rgba(15, 31, 65, .82),
        rgba(1, 3, 10, .97));

    text-align: center;
}

.hidden {
    display: none !important;
}

.title {
    margin: 0 0 8px;

    color: #9aff78;
    font-size: clamp(27px, 7vw, 62px);
    letter-spacing: 5px;

    text-shadow:
        4px 0 #183515,
        0 4px #183515;
}

.subtitle {
    color: #a9b4d0;
    font-size: clamp(9px, 2vw, 15px);
    margin-bottom: 25px;
}

.menuButton {
    min-width: 190px;
    min-height: 50px;

    margin: 6px;

    border: 2px solid #7180a8;
    border-radius: 5px;

    background: #10172b;
    color: white;

    font-family: monospace;
    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

.menuButton:hover {
    background: #1b2848;
}

.menuButton:active {
    transform: scale(.96);
}

.smallInfo {
    margin-top: 15px;
    max-width: 420px;
    padding: 0 15px;

    color: #7985a3;
    font-size: 10px;
    line-height: 1.6;
}

#gameOver h2,
#pauseMenu h2 {
    margin: 0 0 18px;

    color: white;
    font-size: clamp(26px, 6vw, 48px);
    letter-spacing: 3px;
}

#finalScore {
    color: #ffe44a;
    font-size: 20px;
    margin-bottom: 15px;
}

#pauseMenu input {
    width: min(260px, 80vw);
    height: 45px;

    margin: 8px 0;

    border: 2px solid #566382;
    border-radius: 4px;

    background: #080c18;
    color: white;

    text-align: center;
    font-family: monospace;
    font-size: 16px;

    outline: none;
}

#pauseMenu input:focus {
    border-color: #9aff78;
}

#cheatMessage {
    min-height: 18px;
    margin: 5px 0 10px;

    color: #ff76f4;
    font-size: 11px;
}

#orientation {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;

    background: #02030a;
    color: white;

    align-items: center;
    justify-content: center;
    text-align: center;

    font-family: monospace;
    font-size: 18px;
    padding: 30px;
}

@media (orientation: portrait) and (max-width: 700px) {
    #orientation {
        display: flex;
    }

    #gameWrap {
        display: none;
    }
}

@media (max-height: 430px) {
    #creator {
        top: 3px;
        font-size: 8px;
    }

    #hud {
        top: 20px;
    }

    .controlButton {
        bottom: 7px;
        height: 45px;
    }

    #downButton {
        bottom: 58px;
    }
}
</style>
</head>

<body>

<div id="orientation">
    ↻<br><br>
    ПОВЕРНИ ТЕЛЕФОН<br>
    ГОРИЗОНТАЛЬНО
</div>

<div id="gameWrap">

    <div id="game">

        <canvas id="canvas" width="480" height="270"></canvas>

        <div id="creator">
            CREATED BY GETOGENOV
        </div>

        <div id="hud">

            <div class="hudLeft">
                <span id="lives">❤️❤️❤️</span>
                <span>🪙 <span id="score">0</span></span>

                <span id="speedStatus" class="status">
                    ⚡ <span id="speedTimer">0</span>
                </span>

                <span id="shieldStatus" class="status">
                    🛡️ <span id="shieldTimer">0</span>
                </span>

                <span id="aimStatus" class="status">
                    🎯 AIM
                </span>
            </div>

            <div class="hudRight">
                <button id="pauseButton">Ⅱ</button>
            </div>

        </div>

        <div id="controls">

            <button
                id="upButton"
                class="controlButton">
                ▲
            </button>

            <button
                id="downButton"
                class="controlButton">
                ▼
            </button>

            <button
                id="fireButton"
                class="controlButton">
                🔫
            </button>

        </div>

        <!-- START MENU -->

        <div id="menu">

            <h1 class="title">
                SPACE PILOT
            </h1>

            <div class="subtitle">
                PIXEL SPACE ADVENTURE
            </div>

            <button
                id="startButton"
                class="menuButton">
                ▶ START
            </button>

            <div class="smallInfo">
                ▲ ▼ — движение<br>
                🔫 — огонь<br>
                ⏸ — пауза<br>
                Собирай монеты и бонусы.<br>
                Уничтожай астероиды.
            </div>

        </div>

        <!-- PAUSE -->

        <div id="pauseMenu" class="hidden">

            <h2>PAUSED</h2>

            <button
                id="resumeButton"
                class="menuButton">
                ▶ ПРОДОЛЖИТЬ
            </button>

            <button
                id="restartPauseButton"
                class="menuButton">
                🔄 ЗАНОВО
            </button>

            <input
                id="cheatInput"
                type="text"
                autocomplete="off"
                autocapitalize="characters"
                placeholder="ВВЕДИ ЧИТ-КОД">

            <button
                id="cheatButton"
                class="menuButton">
                🔐 АКТИВИРОВАТЬ
            </button>

            <div id="cheatMessage"></div>

            <button
                id="menuButtonFromPause"
                class="menuButton">
                🏠 МЕНЮ
            </button>

        </div>

        <!-- GAME OVER -->

        <div id="gameOver" class="hidden">

            <h2>GAME OVER</h2>

            <div id="finalScore">
                SCORE: 0
            </div>

            <button
                id="restartButton"
                class="menuButton">
                🔄 RESTART
            </button>

            <button
                id="menuButton"
                class="menuButton">
                🏠 MENU
            </button>

        </div>

    </div>
</div>

<script>
"use strict";

/* =========================================================
   BASIC SETUP
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const W = canvas.width;
const H = canvas.height;

/* =========================================================
   UI
========================================================= */

const menu = document.getElementById("menu");
const pauseMenu = document.getElementById("pauseMenu");
const gameOver = document.getElementById("gameOver");

const startButton = document.getElementById("startButton");
const pauseButton = document.getElementById("pauseButton");
const resumeButton = document.getElementById("resumeButton");

const restartButton = document.getElementById("restartButton");
const restartPauseButton =
    document.getElementById("restartPauseButton");

const menuButton =
    document.getElementById("menuButton");

const menuButtonFromPause =
    document.getElementById("menuButtonFromPause");

const cheatInput =
    document.getElementById("cheatInput");

const cheatButton =
    document.getElementById("cheatButton");

const cheatMessage =
    document.getElementById("cheatMessage");

const livesElement =
    document.getElementById("lives");

const scoreElement =
    document.getElementById("score");

const finalScoreElement =
    document.getElementById("finalScore");

const speedStatus =
    document.getElementById("speedStatus");

const shieldStatus =
    document.getElementById("shieldStatus");

const aimStatus =
    document.getElementById("aimStatus");

const speedTimerElement =
    document.getElementById("speedTimer");

const shieldTimerElement =
    document.getElementById("shieldTimer");

/* =========================================================
   GAME STATE
========================================================= */

let gameRunning = false;
let paused = false;

let score = 0;
let lives = 3;

let lastTime = 0;
let asteroidTimer = 0;
let coinTimer = 0;
let powerTimer = 0;

let difficulty = 1;

let speedBoostTimer = 0;
let shieldTimer = 0;

let autoAim = false;

let fireCooldown = 0;

let invulnerabilityTimer = 0;

/* =========================================================
   SHIP
========================================================= */

const ship = {
    x: 70,
    y: H / 2,

    width: 38,
    height: 24,

    speed: 145,

    movingUp: false,
    movingDown: false
};

/* =========================================================
   OBJECT ARRAYS
========================================================= */

const stars = [];
const asteroids = [];
const bullets = [];
const coins = [];
const powerups = [];
const particles = [];

/* =========================================================
   RANDOM HELPERS
========================================================= */

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function randomInt(min, max) {
    return Math.floor(random(min, max + 1));
}

/* =========================================================
   STARS
========================================================= */

function createStars() {

    stars.length = 0;

    for (let i = 0; i < 90; i++) {

        stars.push({
            x: random(0, W),
            y: random(0, H),
            size: randomInt(1, 2),
            speed: random(8, 40),
            brightness: random(.3, 1)
        });
    }
}

/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(dt) {

    ctx.fillStyle = "#02030a";
    ctx.fillRect(0, 0, W, H);

    for (const star of stars) {

        star.x -= star.speed * dt;

        if (star.x < 0) {
            star.x = W;
            star.y = random(0, H);
        }

        const alpha =
            Math.max(.2, star.brightness);

        ctx.fillStyle =
            `rgba(190,220,255,${alpha})`;

        ctx.fillRect(
            Math.floor(star.x),
            Math.floor(star.y),
            star.size,
            star.size
        );
    }

    /* distant lines */

    ctx.fillStyle = "rgba(50,70,110,.12)";

    for (let y = 0; y < H; y += 30) {

        ctx.fillRect(
            0,
            y,
            W,
            1
        );
    }
}

/* =========================================================
   SHIP
========================================================= */

function drawShip() {

    ctx.save();

    ctx.translate(ship.x, ship.y);

    /* Shield */

    if (shieldTimer > 0) {

        ctx.strokeStyle = "#52d9ff";
        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            25,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.fillStyle =
            "rgba(70,210,255,.08)";

        ctx.fill();
    }

    /* ship shadow */

    ctx.fillStyle = "#071006";

    ctx.fillRect(
        -18,
        -8,
        36,
        17
    );

    /* main green hull */

    ctx.fillStyle = "#63d348";

    ctx.beginPath();

    ctx.moveTo(22, 0);
    ctx.lineTo(-13, -12);
    ctx.lineTo(-20, -7);
    ctx.lineTo(-15, 0);
    ctx.lineTo(-20, 7);
    ctx.lineTo(-13, 12);
    ctx.closePath();

    ctx.fill();

    /* lighter upper section */

    ctx.fillStyle = "#a0ef65";

    ctx.beginPath();

    ctx.moveTo(20, 0);
    ctx.lineTo(-9, -9);
    ctx.lineTo(-3, -2);
    ctx.closePath();

    ctx.fill();

    /* cockpit */

    ctx.fillStyle = "#79d9e8";

    ctx.fillRect(
        1,
        -5,
        9,
        7
    );

    ctx.fillStyle = "#d4ffff";

    ctx.fillRect(
        3,
        -4,
        4,
        2
    );

    /* engine */

    ctx.fillStyle = "#ffb52d";

    ctx.fillRect(
        -21,
        -4,
        7,
        8
    );

    ctx.fillStyle = "#fff06a";

    ctx.fillRect(
        -24,
        -2,
        4,
        4
    );

    ctx.restore();
}

/* =========================================================
   BULLETS
========================================================= */

function shoot() {

    if (!gameRunning || paused) {
        return;
    }

    if (fireCooldown > 0) {
        return;
    }

    let target = null;

    if (autoAim) {
        target = getNearestAsteroid();
    }

    const bullet = {
        x: ship.x + 20,
        y: ship.y,

        speed: 300,

        width: 9,
        height: 2,

        targetX: target ? target.x : null,
        targetY: target ? target.y : null
    };

    bullets.push(bullet);

    fireCooldown =
        speedBoostTimer > 0 ? .10 : .18;

    createParticles(
        bullet.x,
        bullet.y,
        "#8aff55",
        3
    );
}

function updateBullets(dt) {

    for (let i = bullets.length - 1; i >= 0; i--) {

        const bullet = bullets[i];

        if (autoAim && bullet.targetX !== null) {

            const dx = bullet.targetX - bullet.x;
            const dy = bullet.targetY - bullet.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            if (distance > 1) {

                const aimSpeed = 250;

                bullet.x +=
                    (dx / distance) *
                    aimSpeed *
                    dt;

                bullet.y +=
                    (dy / distance) *
                    aimSpeed *
                    dt;
            }

        } else {

            bullet.x +=
                bullet.speed * dt;
        }

        if (
            bullet.x > W + 20 ||
            bullet.y < -20 ||
            bullet.y > H + 20
        ) {

            bullets.splice(i, 1);
        }
    }
}

function drawBullets() {

    for (const bullet of bullets) {

        ctx.fillStyle = "#a6ff6a";

        ctx.fillRect(
            Math.floor(bullet.x),
            Math.floor(bullet.y),
            bullet.width,
            bullet.height
        );

        ctx.fillStyle = "#eaffd7";

        ctx.fillRect(
            Math.floor(bullet.x + 2),
            Math.floor(bullet.y),
            4,
            2
        );
    }
}

/* =========================================================
   ASTEROIDS
========================================================= */

function createAsteroid() {

    const radius =
        random(11, 20);

    const points = randomInt(7, 10);

    const vertices = [];

    for (let i = 0; i < points; i++) {

        const angle =
            (Math.PI * 2 / points) * i;

        const distance =
            radius * random(.75, 1.25);

        vertices.push({
            x: Math.cos(angle) * distance,
            y: Math.sin(angle) * distance
        });
    }

    const craters = [];

    for (let i = 0; i < randomInt(2, 4); i++) {

        craters.push({
            x: random(-radius * .5, radius * .5),
            y: random(-radius * .5, radius * .5),
            size: random(2, 5)
        });
    }

    asteroids.push({

        x: W + radius + 10,
        y: random(25, H - 25),

        radius,
        vertices,
        craters,

        speed:
            random(70, 105) +
            difficulty * 10,

        rotation:
            random(-1.5, 1.5),

        angle: 0
    });
}

function updateAsteroids(dt) {

    for (let i = asteroids.length - 1; i >= 0; i--) {

        const asteroid = asteroids[i];

        asteroid.x -=
            asteroid.speed * dt;

        asteroid.angle +=
            asteroid.rotation * dt;

        if (asteroid.x < -60) {

            asteroids.splice(i, 1);
            continue;
        }

        if (
            collisionCircle(
                ship.x,
                ship.y,
                16,
                asteroid.x,
                asteroid.y,
                asteroid.radius
            )
        ) {

            hitAsteroid(i);
        }
    }
}

function drawAsteroids() {

    for (const asteroid of asteroids) {

        ctx.save();

        ctx.translate(
            Math.floor(asteroid.x),
            Math.floor(asteroid.y)
        );

        ctx.rotate(asteroid.angle);

        /* rock */

        ctx.fillStyle = "#59606a";

        ctx.beginPath();

        for (
            let i = 0;
            i < asteroid.vertices.length;
            i++
        ) {

            const p =
                asteroid.vertices[i];

            if (i === 0) {
                ctx.moveTo(p.x, p.y);
            } else {
                ctx.lineTo(p.x, p.y);
            }
        }

        ctx.closePath();
        ctx.fill();

        /* dark edge */

        ctx.strokeStyle = "#303640";
        ctx.lineWidth = 2;
        ctx.stroke();

        /* craters */

        for (const crater of asteroid.craters) {

            ctx.fillStyle = "#363b42";

            ctx.fillRect(
                Math.floor(
                    crater.x - crater.size / 2
                ),
                Math.floor(
                    crater.y - crater.size / 2
                ),
                Math.floor(crater.size),
                Math.floor(crater.size)
            );

            ctx.fillStyle = "#717982";

            ctx.fillRect(
                Math.floor(
                    crater.x - crater.size / 2
                ),
                Math.floor(
                    crater.y - crater.size / 2
                ),
                1,
                1
            );
        }

        ctx.restore();
    }
}

/* =========================================================
   COINS
========================================================= */

function createCoin() {

    coins.push({

        x: W + 15,
        y: random(25, H - 25),

        radius: 8,

        speed: 90 + difficulty * 7,

        rotation: random(0, Math.PI * 2),

        spin: random(4, 7)
    });
}

function updateCoins(dt) {

    for (let i = coins.length - 1; i >= 0; i--) {

        const coin = coins[i];

        coin.x -=
            coin.speed * dt;

        coin.rotation +=
            coin.spin * dt;

        if (coin.x < -20) {

            coins.splice(i, 1);
            continue;
        }

        if (
            collisionCircle(
                ship.x,
                ship.y,
                15,
                coin.x,
                coin.y,
                coin.radius
            )
        ) {

            score += 10;

            createParticles(
                coin.x,
                coin.y,
                "#ffe44a",
                12
            );

            coins.splice(i, 1);

            updateHUD();
        }
    }
}

function drawCoin(coin) {

    ctx.save();

    ctx.translate(
        Math.floor(coin.x),
        Math.floor(coin.y)
    );

    /*
       Симулируем вращение монеты:
       она становится уже/шире по X.
    */

    const width =
        Math.abs(Math.cos(coin.rotation)) *
        coin.radius;

    ctx.fillStyle = "#ffd83d";

    ctx.fillRect(
        -Math.max(2, width),
        -coin.radius,
        Math.max(4, width * 2),
        coin.radius * 2
    );

    ctx.strokeStyle = "#fff18a";
    ctx.lineWidth = 1;

    ctx.strokeRect(
        -Math.max(2, width),
        -coin.radius,
        Math.max(4, width * 2),
        coin.radius * 2
    );

    /* star */

    ctx.fillStyle = "#fff8b0";

    const starScale =
        Math.max(.35, width / coin.radius);

    drawStar(
        0,
        0,
        4,
        2,
        starScale
    );

    ctx.restore();
}

function drawStar(
    x,
    y,
    outer,
    inner,
    scale = 1
) {

    ctx.beginPath();

    for (let i = 0; i < 10; i++) {

        const radius =
            (i % 2 === 0 ? outer : inner) *
            scale;

        const angle =
            -Math.PI / 2 +
            i * Math.PI / 5;

        const px =
            x + Math.cos(angle) * radius;

        const py =
            y + Math.sin(angle) * radius;

        if (i === 0) {
            ctx.moveTo(px, py);
        } else {
            ctx.lineTo(px, py);
        }
    }

    ctx.closePath();
    ctx.fill();
}

/* =========================================================
   POWERUPS
========================================================= */

function createPowerup() {

    const type =
        Math.random() < .5
            ? "speed"
            : "shield";

    powerups.push({

        type,

        x: W + 20,
        y: random(35, H - 35),

        size: 10,

        speed: 80 + difficulty * 5,

        pulse: random(0, Math.PI * 2)
    });
}

function updatePowerups(dt) {

    for (let i = powerups.length - 1; i >= 0; i--) {

        const power = powerups[i];

        power.x -=
            power.speed * dt;

        power.pulse +=
            dt * 5;

        if (power.x < -30) {

            powerups.splice(i, 1);
            continue;
        }

        if (
            collisionCircle(
                ship.x,
                ship.y,
                15,
                power.x,
                power.y,
                power.size
            )
        ) {

            activatePowerup(
                power.type
            );

            createParticles(
                power.x,
                power.y,
                power.type === "speed"
                    ? "#ffe44a"
                    : "#58dfff",
                16
            );

            powerups.splice(i, 1);
        }
    }
}

function drawPowerups() {

    for (const power of powerups) {

        const pulse =
            Math.sin(power.pulse) * 2;

        ctx.save();

        ctx.translate(
            Math.floor(power.x),
            Math.floor(power.y)
        );

        ctx.fillStyle =
            power.type === "speed"
                ? "#ffe44a"
                : "#58dfff";

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1;

        ctx.fillRect(
            -10 - pulse / 2,
            -10 - pulse / 2,
            20 + pulse,
            20 + pulse
        );

        ctx.strokeRect(
            -10 - pulse / 2,
            -10 - pulse / 2,
            20 + pulse,
            20 + pulse
        );

        ctx.fillStyle = "#10151f";

        ctx.font = "bold 12px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            power.type === "speed"
                ? "⚡"
                : "🛡",
            0,
            1
        );

        ctx.restore();
    }
}

function activatePowerup(type) {

    if (type === "speed") {

        speedBoostTimer = 5;

    } else {

        shieldTimer = 6;
    }

    updateHUD();
}

/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    x,
    y,
    color,
    amount
) {

    for (let i = 0; i < amount; i++) {

        particles.push({

            x,
            y,

            vx: random(-80, 80),
            vy: random(-80, 80),

            life: random(.2, .6),

            maxLife: .6,

            size: random(1, 3),

            color
        });
    }
}

function updateParticles(dt) {

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.life -= dt;

        if (p.life <= 0) {

            particles.splice(i, 1);
        }
    }
}

function drawParticles() {

    for (const p of particles) {

        ctx.globalAlpha =
            Math.max(0, p.life / p.maxLife);

        ctx.fillStyle = p.color;

        ctx.fillRect(
            Math.floor(p.x),
            Math.floor(p.y),
            Math.ceil(p.size),
            Math.ceil(p.size)
        );
    }

    ctx.globalAlpha = 1;
}

/* =========================================================
   COLLISION
========================================================= */

function collisionCircle(
    x1,
    y1,
    r1,
    x2,
    y2,
    r2
) {

    const dx = x1 - x2;
    const dy = y1 - y2;

    const distance =
        Math.sqrt(dx * dx + dy * dy);

    return distance < r1 + r2;
}

/* =========================================================
   BULLET / ASTEROID COLLISIONS
========================================================= */

function checkBulletCollisions() {

    for (
        let b = bullets.length - 1;
        b >= 0;
        b--
    ) {

        const bullet = bullets[b];

        for (
            let a = asteroids.length - 1;
            a >= 0;
            a--
        ) {

            const asteroid =
                asteroids[a];

            if (
                collisionCircle(
                    bullet.x,
                    bullet.y,
                    4,
                    asteroid.x,
                    asteroid.y,
                    asteroid.radius
                )
            ) {

                createParticles(
                    asteroid.x,
                    asteroid.y,
                    "#ff9c58",
                    16
                );

                score += 5;

                bullets.splice(b, 1);
                asteroids.splice(a, 1);

                updateHUD();

                break;
            }
        }
    }
}

/* =========================================================
   ASTEROID / SHIP HIT
========================================================= */

function hitAsteroid(index) {

    if (invulnerabilityTimer > 0) {
        return;
    }

    if (shieldTimer > 0) {

        createParticles(
            ship.x,
            ship.y,
            "#5ce5ff",
            20
        );

        shieldTimer = 0;

        updateHUD();

        return;
    }

    lives--;

    invulnerabilityTimer = 1.2;

    createParticles(
        ship.x,
        ship.y,
        "#ff5b5b",
        25
    );

    asteroids.splice(index, 1);

    updateHUD();

    if (lives <= 0) {

        endGame();
    }
}

/* =========================================================
   AUTO AIM
========================================================= */

function getNearestAsteroid() {

    let nearest = null;
    let nearestDistance = Infinity;

    for (const asteroid of asteroids) {

        if (asteroid.x < ship.x) {
            continue;
        }

        const dx =
            asteroid.x - ship.x;

        const dy =
            asteroid.y - ship.y;

        const distance =
            dx * dx + dy * dy;

        if (distance < nearestDistance) {

            nearestDistance = distance;
            nearest = asteroid;
        }
    }

    return nearest;
}

/* =========================================================
   SHIP MOVEMENT
========================================================= */

function updateShip(dt) {

    let direction = 0;

    if (ship.movingUp) {
        direction -= 1;
    }

    if (ship.movingDown) {
        direction += 1;
    }

    const currentSpeed =
        ship.speed *
        (speedBoostTimer > 0 ? 1.75 : 1);

    ship.y +=
        direction *
        currentSpeed *
        dt;

    const margin = 18;

    if (ship.y < margin) {
        ship.y = margin;
    }

    if (ship.y > H - margin) {
        ship.y = H - margin;
    }
}

/* =========================================================
   GAME UPDATE
========================================================= */

function update(dt) {

    if (!gameRunning || paused) {
        return;
    }

    if (speedBoostTimer > 0) {

        speedBoostTimer -= dt;

        if (speedBoostTimer < 0) {
            speedBoostTimer = 0;
        }
    }

    if (shieldTimer > 0) {

        shieldTimer -= dt;

        if (shieldTimer < 0) {
            shieldTimer = 0;
        }
    }

    if (invulnerabilityTimer > 0) {

        invulnerabilityTimer -= dt;

        if (invulnerabilityTimer < 0) {
            invulnerabilityTimer = 0;
        }
    }

    if (fireCooldown > 0) {
        fireCooldown -= dt;
    }

    difficulty += dt * .025;

    updateShip(dt);

    updateBullets(dt);
    updateAsteroids(dt);
    updateCoins(dt);
    updatePowerups(dt);
    updateParticles(dt);

    checkBulletCollisions();

    asteroidTimer += dt;
    coinTimer += dt;
    powerTimer += dt;

    const asteroidInterval =
        Math.max(
            .45,
            1.15 - difficulty * .025
        );

    if (asteroidTimer >= asteroidInterval) {

        asteroidTimer = 0;

        createAsteroid();
    }

    if (coinTimer >= 1.7) {

        coinTimer = 0;

        createCoin();
    }

    if (powerTimer >= 7) {

        powerTimer = 0;

        if (Math.random() < .65) {
            createPowerup();
        }
    }

    updateHUD();
}

/* =========================================================
   DRAW
========================================================= */

function draw() {

    drawBackground(0);

    drawPowerups();
    drawCoins();
    drawAsteroids();
    drawBullets();
    drawParticles();

    /*
       Когда корабль получает урон,
       он мигает.
    */

    if (
        invulnerabilityTimer <= 0 ||
        Math.floor(invulnerabilityTimer * 10) % 2 === 0
    ) {

        drawShip();
    }
}

function drawCoins() {

    for (const coin of coins) {
        drawCoin(coin);
    }
}

/* =========================================================
   MAIN LOOP
========================================================= */

function gameLoop(timestamp) {

    let dt =
        (timestamp - lastTime) / 1000;

    lastTime = timestamp;

    if (dt > .05) {
        dt = .05;
    }

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    livesElement.textContent =
        "❤️".repeat(Math.max(0, lives));

    scoreElement.textContent =
        score;

    if (speedBoostTimer > 0) {

        speedStatus.style.display =
            "inline-block";

        speedTimerElement.textContent =
            Math.ceil(speedBoostTimer);

    } else {

        speedStatus.style.display =
            "none";
    }

    if (shieldTimer > 0) {

        shieldStatus.style.display =
            "inline-block";

        shieldTimerElement.textContent =
            Math.ceil(shieldTimer);

    } else {

        shieldStatus.style.display =
            "none";
    }

    if (autoAim) {

        aimStatus.style.display =
            "inline-block";

    } else {

        aimStatus.style.display =
            "none";
    }
}

/* =========================================================
   START GAME
========================================================= */

function startGame() {

    menu.classList.add("hidden");
    gameOver.classList.add("hidden");
    pauseMenu.classList.add("hidden");

    gameRunning = true;
    paused = false;

    score = 0;
    lives = 3;

    difficulty = 1;

    asteroidTimer = 0;
    coinTimer = 0;
    powerTimer = 0;

    speedBoostTimer = 0;
    shieldTimer = 0;

    invulnerabilityTimer = 0;
    fireCooldown = 0;

    autoAim = false;

    ship.x = 70;
    ship.y = H / 2;

    asteroids.length = 0;
    bullets.length = 0;
    coins.length = 0;
    powerups.length = 0;
    particles.length = 0;

    updateHUD();
}

/* =========================================================
   END GAME
========================================================= */

function endGame() {

    gameRunning = false;
    paused = false;

    finalScoreElement.textContent =
        "SCORE: " + score;

    gameOver.classList.remove("hidden");
}

/* =========================================================
   PAUSE
========================================================= */

function togglePause() {

    if (!gameRunning) {
        return;
    }

    paused = !paused;

    if (paused) {

        pauseMenu.classList.remove("hidden");

    } else {

        pauseMenu.classList.add("hidden");

        cheatInput.blur();
    }
}

/* =========================================================
   RETURN TO MENU
========================================================= */

function returnToMenu() {

    gameRunning = false;
    paused = false;

    pauseMenu.classList.add("hidden");
    gameOver.classList.add("hidden");
    menu.classList.remove("hidden");

    autoAim = false;

    updateHUD();
}

/* =========================================================
   CHEAT CODE
========================================================= */

function activateCheat() {

    const code =
        cheatInput.value
            .trim()
            .toUpperCase();

    if (code === "ASTRO-AIM") {

        autoAim = true;

        cheatMessage.textContent =
            "✓ AUTO AIM АКТИВИРОВАН";

        cheatInput.value = "";

        updateHUD();

    } else {

        cheatMessage.textContent =
            "✕ НЕВЕРНЫЙ ЧИТ-КОД";
    }
}

/* =========================================================
   BUTTON SETUP
========================================================= */

function setupHoldButton(
    element,
    onStart,
    onEnd
) {

    element.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            onStart();

            try {
                element.setPointerCapture(
                    event.pointerId
                );
            } catch (_) {}
        }
    );

    element.addEventListener(
        "pointerup",
        event => {

            event.preventDefault();

            onEnd();
        }
    );

    element.addEventListener(
        "pointercancel",
        onEnd
    );

    element.addEventListener(
        "pointerleave",
        event => {

            if (
                event.buttons === 0
            ) {
                onEnd();
            }
        }
    );
}

setupHoldButton(
    document.getElementById("upButton"),

    () => {
        ship.movingUp = true;
    },

    () => {
        ship.movingUp = false;
    }
);

setupHoldButton(
    document.getElementById("downButton"),

    () => {
        ship.movingDown = true;
    },

    () => {
        ship.movingDown = false;
    }
);

setupHoldButton(
    document.getElementById("fireButton"),

    () => {
        shoot();
    },

    () => {}
);

/* =========================================================
   BUTTON EVENTS
========================================================= */

startButton.addEventListener(
    "click",
    startGame
);

pauseButton.addEventListener(
    "click",
    togglePause
);

resumeButton.addEventListener(
    "click",
    togglePause
);

restartButton.addEventListener(
    "click",
    startGame
);

restartPauseButton.addEventListener(
    "click",
    startGame
);

menuButton.addEventListener(
    "click",
    returnToMenu
);

menuButtonFromPause.addEventListener(
    "click",
    returnToMenu
);

cheatButton.addEventListener(
    "click",
    activateCheat
);

cheatInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            activateCheat();
        }
    }
);

/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (event.key === "ArrowUp") {

            event.preventDefault();

            ship.movingUp = true;
        }

        if (event.key === "ArrowDown") {

            event.preventDefault();

            ship.movingDown = true;
        }

        if (
            event.key === " " ||
            event.key === "Spacebar"
        ) {

            event.preventDefault();

            shoot();
        }

        if (
            event.key === "Escape" ||
            event.key.toLowerCase() === "p"
        ) {

            if (
                gameRunning &&
                document.activeElement !== cheatInput
            ) {

                togglePause();
            }
        }
    }
);

document.addEventListener(
    "keyup",
    event => {

        if (event.key === "ArrowUp") {
            ship.movingUp = false;
        }

        if (event.key === "ArrowDown") {
            ship.movingDown = false;
        }
    }
);

/* =========================================================
   INITIALIZATION
========================================================= */

createStars();

updateHUD();

draw();

requestAnimationFrame(
    gameLoop
);
</script>

</body>
